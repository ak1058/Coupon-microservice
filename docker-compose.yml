version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: coupon_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coupon_microservice_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coupon_microservice_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coupon_network

  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: coupon_api
    environment:
      POSTGRES_HOST: postgres  
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - coupon_network
    restart: unless-stopped
    

networks:
  coupon_network:
    driver: bridge

volumes:
  postgres_data: